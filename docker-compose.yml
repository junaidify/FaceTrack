version: "3.8"

services:

  # ── Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facetrack
      POSTGRES_USER: facetrack
      POSTGRES_PASSWORD: facetrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facetrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Face Recognition Microservice (Python / InsightFace) ──
  face-service:
    build:
      context: ./FaceService
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      APP_PORT: "8002"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/healthz"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ── Spring Boot Backend ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/facetrack
      POSTGRES_USER: facetrack
      POSTGRES_PASSWORD: facetrack
      JWT_SECRET: change-me-to-a-strong-secret-key-min16
      FACE_SERVICE_URL: http://face-service:8002
      FACE_MATCH_THRESHOLD: "0.45"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      SEED_ADMIN_EMAIL: admin@facetrack.local
      SEED_ADMIN_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
      face-service:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend (Nginx) ───────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
