server:
  port: 8000
  servlet:
    context-path: /

spring:
  application:
    name: facetrack-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/facetrack}
    username: ${POSTGRES_USER:facetrack}
    password: ${POSTGRES_PASSWORD:facetrack}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Application-specific config
app:
  jwt:
    secret: ${JWT_SECRET:changeme-min-16-chars}
    algorithm: HS256
    expiration-minutes: ${JWT_EXPIRES_MINUTES:720}
  face-service:
    url: ${FACE_SERVICE_URL:http://face-service:8002}
    match-threshold: ${FACE_MATCH_THRESHOLD:0.45}
    timeout-seconds: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@facetrack.local}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
    admin-name: ${SEED_ADMIN_NAME:Default Admin}

logging:
  level:
    com.facetrack: DEBUG
    org.springframework.security: WARN
